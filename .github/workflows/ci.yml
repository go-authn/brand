# The assets in this repository are consumed by the profile README and by the
# landing page, which show them at 36 and 88 pixels: a mark that came out blank
# or the wrong size looks like a broken image on somebody else's page, and
# nothing here would have said so. So the invariants are checked rather than
# remembered.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    name: the marks are what the README says they are
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PNG dimensions come from the IHDR chunk, which is the first 24 bytes of
      # the file. Reading them needs no image library, so this lane installs
      # nothing -- and a blank render is caught by size, since a failed Quick
      # Look thumbnail is a few hundred bytes where a real mark is over 100 KB.
      - name: Every avatar is 400x400 and not blank
        run: |
          python3 - <<'PY'
          import glob, struct, sys
          bad = []
          files = sorted(glob.glob("avatar/*.png"))
          if not files:
              sys.exit("::error::no avatars at all")
          for p in files:
              b = open(p, "rb").read()
              if b[:8] != b"\x89PNG\r\n\x1a\n":
                  bad.append(f"{p}: not a PNG")
                  continue
              w, h = struct.unpack(">II", b[16:24])
              note = f"{p}: {w}x{h}, {len(b)} bytes"
              if (w, h) != (400, 400):
                  bad.append(note + " -- must be 400x400")
              elif len(b) < 10000:
                  bad.append(note + " -- too small to hold a mark; a blank render looks like this")
              else:
                  print(note)
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY

      - name: Every per-repo SVG has an avatar, and the other way round
        run: |
          svg=$(ls svg/color/go-authn-*.svg | sed 's|.*/||;s|\.svg$||' | sort)
          png=$(ls avatar/go-authn-*.png | sed 's|.*/||;s|\.png$||' | sort)
          diff <(echo "$svg") <(echo "$png") \
            || { echo "::error::an SVG and its avatar disagree (< is svg, > is avatar)"; exit 1; }
          echo "$svg" | sed 's/^/mark: /'

      # The declination is deliberately mechanical: a per-repo mark is the mfa
      # file with the aria-label and the <text> changed. A hand-drawn glyph for
      # one repo breaks the family at a glance and would otherwise be reviewed
      # by eye, once, and never again. font-size is exempt, because a long name
      # is allowed to need a smaller one.
      - name: Every per-repo mark is the org glyph declined, not a new drawing
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          def norm(path):
              s = open(path).read()
              name = os.path.basename(path)[len("go-authn-"):-len(".svg")]
              s = s.replace(f'aria-label="{name}"', 'aria-label="NAME"')
              s = s.replace(f'>{name}</text>', '>NAME</text>')
              return re.sub(r'font-size="\d+"', 'font-size="N"', s)
          ref = "svg/color/go-authn-mfa.svg"
          want = norm(ref)
          bad = False
          for p in sorted(glob.glob("svg/color/go-authn-*.svg")):
              if p == ref:
                  continue
              if norm(p) == want:
                  print(f"{p}: declined from {ref}")
              else:
                  print(f"::error::{p} is not {ref} with the name changed")
                  bad = True
          sys.exit(1 if bad else 0)
          PY
