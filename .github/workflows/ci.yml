# The assets in this repository are consumed by the profile README and by the
# landing page, which show them at 36 and 88 pixels: a mark that came out blank
# or the wrong size looks like a broken image on somebody else's page, and
# nothing here would have said so. So the invariants are checked rather than
# remembered.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    name: the marks are what the README says they are
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PNG dimensions come from the IHDR chunk, which is the first 24 bytes of
      # the file. Reading them needs no image library, so this lane installs
      # nothing -- and a blank render is caught by size, since a failed Quick
      # Look thumbnail is a few hundred bytes where a real mark is over 100 KB.
      - name: Every avatar is 512x512 and not blank
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(avatar/*.png)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no avatars at all"; exit 1; fi
          bad=0
          for p in "${files[@]}"; do
            # The IHDR chunk is the first 24 bytes. The sizes are read a BYTE at a
            # time and combined here: od --endian is GNU-only, so a check
            # written with it cannot be run on the machine it is written on.
            read -r a b c d e f g h8 < <(od -An -tu1 -j16 -N8 "$p" | tr -s ' ' | sed 's/^ //')
            w=$(( a * 16777216 + b * 65536 + c * 256 + d ))
            h=$(( e * 16777216 + f * 65536 + g * 256 + h8 ))
            bytes=$(wc -c < "$p" | tr -d ' ')
            note="$p: ${w}x${h}, ${bytes} bytes"
            if [ "$w" != 512 ] || [ "$h" != 512 ]; then
              echo "::error::$note -- must be 512x512"; bad=1
            elif [ "$bytes" -lt 10000 ]; then
              echo "::error::$note -- too small to hold a mark; a blank render looks like this"; bad=1
            else
              echo "$note"
            fi
          done
          exit $bad

      # ⛔ The reason this repository existed for a week without most of itself:
      # the family kit is svg in three variants, png 16 to 1024 in three
      # variants, jpg, ico, icns, an avatar and a social banner -- and only
      # three of those were here. A check that counts is cheaper than
      # remembering.
      - name: Every subject has the whole family matrix
        run: |
          set -euo pipefail
          shopt -s nullglob
          subjects=$(ls svg/color/*.svg 2>/dev/null | sed 's|.*/||;s|\.svg$||' | sort)
          if [ -z "$subjects" ]; then echo "::error::no colour SVG at all"; exit 1; fi
          missing=0
          for sid in $subjects; do
            for v in color white black; do
              [ -f "svg/$v/$sid.svg" ] || { echo "::error::missing svg/$v/$sid.svg"; missing=1; }
              for s in 16 32 48 64 128 256 512 1024; do
                [ -f "png/$v/$s/$sid.png" ] || { echo "::error::missing png/$v/$s/$sid.png"; missing=1; }
              done
            done
            for s in 16 32 48 64 128 256 512 1024; do
              [ -f "jpg/$s/$sid.jpg" ] || { echo "::error::missing jpg/$s/$sid.jpg"; missing=1; }
            done
            for f in "ico/$sid.ico" "icns/$sid.icns" "avatar/$sid.png" "social/$sid.png"; do
              [ -f "$f" ] || { echo "::error::missing $f"; missing=1; }
            done
            [ "$missing" = 0 ] && echo "$sid: the whole matrix"
          done
          exit $missing

      - name: Every per-repo SVG has an avatar, and the other way round
        run: |
          svg=$(ls svg/color/go-authn-*.svg | sed 's|.*/||;s|\.svg$||' | sort)
          png=$(ls avatar/go-authn-*.png | sed 's|.*/||;s|\.png$||' | sort)
          diff <(echo "$svg") <(echo "$png") \
            || { echo "::error::an SVG and its avatar disagree (< is svg, > is avatar)"; exit 1; }
          echo "$svg" | sed 's/^/mark: /'

      # The declination is deliberately mechanical: a per-repo mark is the mfa
      # file with the aria-label and the <text> changed. A hand-drawn glyph for
      # one repo breaks the family at a glance and would otherwise be reviewed
      # by eye, once, and never again. font-size is exempt, because a long name
      # is allowed to need a smaller one.
      - name: Every per-repo mark is the org glyph declined, not a new drawing
        run: |
          set -euo pipefail
          # The name is normalised out of the aria-label and the plate, and
          # font-size with it: a long name is allowed to need a smaller one.
          norm() {
            local n; n=$(basename "$1"); n=${n#go-authn-}; n=${n%.svg}
            sed "s/aria-label=\"$n\"/aria-label=\"NAME\"/; s|>$n</text>|>NAME</text>|; s/font-size=\"[0-9]*\"/font-size=\"N\"/" "$1"
          }
          ref=svg/color/go-authn-mfa.svg
          bad=0
          for p in svg/color/go-authn-*.svg; do
            [ "$p" = "$ref" ] && continue
            if diff -q <(norm "$ref") <(norm "$p") >/dev/null; then
              echo "$p: declined from $ref"
            else
              echo "::error::$p is not $ref with the name changed"
              bad=1
            fi
          done
          exit $bad
